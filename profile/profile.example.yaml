# profile.example.yaml — copy to profile.yaml and edit. Works for every company.
identity:
  first_name: Kuldeep
  last_name: Bishnoi
  preferred_name: Kuldeep
  email: kuldeepbishnoi.2001@gmail.com
  phone: "+91 9416375330"
  country: India
  linkedin: https://www.linkedin.com/in/bishnoikuldeep/
  website: ""

resume: resume/kuldeep_bishnoi.pdf

# WHAT you want — picks jobs out of the listing, and answers "which cities" for you.
# Applies to EVERY site: a job must pass all of these. Amazon titles read "Software Development
# Engineer" / "Software Dev Engineer" (not "Software Engineer"), and Amazon lists no IC/manager
# level, so `seniority` filters out every Amazon job unless it's empty.
want:
  titles_any: [SDE, Software Engineer, Software Development Engineer, Software Dev Engineer, Backend, Full Stack]
  titles_none: [Manager, Director, Intern]
  locations: [Bangalore, Remote, India, Toronto, Vancouver]
  seniority: []           # e.g. [Individual Contributor] for Datadog; must be empty for Amazon

# HOW you answer — generic intents, reused across every company + ATS.
# Types match the question: boolean = yes/no, string = single choice/free text, list = multi-select.
answers:
  work_authorization: true        # yes/no  -> picks the "Yes" option
  needs_sponsorship: false        # yes/no
  acknowledge_true: true          # yes/no
  privacy_consent: true           # yes/no
  how_did_you_hear: "LinkedIn"    # single choice / free text
  languages: [English, Hindi]     # multi-select
  # Screening questions (Amazon "job-specific questions" and similar):
  years_of_experience: 6          # number -> the "N to less than M years" bucket containing it · MAX -> always the top bucket
  skills_experience: true         # answers Yes to EVERY "Do you have experience with/in …?"; false = No; omit = park for review
  degree_bachelors: true          # "Do you have a Bachelor's degree …?"
  degree_masters: false
  willing_to_relocate: true
  # Work-eligibility questions (Amazon reuses last time's answers, so these only fill an EMPTY form):
  # previously_applied: true        # "Have you previously applied to Amazon …?"
  # previous_employment: false      # "Have you previously been employed by Amazon …?"
  # non_compete: false              # "Are you subject to a non-competition agreement …?"
  # government_employee: false      # -> "No, I was NEVER a government employee." (use "former"/"current" for those)
  # lived_abroad: true              # "…lived outside <country> for 12 consecutive months?"
  # countries_lived: [India]        # its follow-up: which countries (multi-select, exact names)
  # permanent_resident_elsewhere: false  # "since obtaining citizenship, did you become a permanent resident elsewhere?"
  # sanctioned_country: false
  # citizenship: India              # "In which country/region do you have citizenship?"
  # Canonical tokens (see src/engine/answer-tokens.ts) — map to each company's exact wording.
  gender: DECLINE
  hispanic_latino: DECLINE
  veteran_status: NOT_A_VETERAN
  disability: NO_DISABILITY
  # Canada Employment Equity Act self-ID (Amazon CAN): DECLINE -> "I choose not to self-identify".
  indigenous: DECLINE
  visible_minority: DECLINE
  racial_identity: DECLINE
  ex_military: DECLINE
  reserve_forces: DECLINE
  military_spouse: DECLINE

# Exact-question-text -> answer, for rare one-offs the intent rules don't cover (optional).
overrides: {}
  # "please select all the languages you speak fluently": [English]

on_unknown: park        # unmatched required question -> park (default) | skip | guess (pick decline/No, record "(guessed)", never stuck)
auto_submit: false      # false = fill + OTP then you approve · true = hands-free (needed for daily runs)
# max_per_run: 15       # cap the queue per run — handy to test hands-free submission on a small batch

# Per-site knobs (optional).
amazon:
  # Apply your filters on amazon.jobs/en/search and paste the page URL. Discovery turns it into the
  # JSON API query, so the queue = exactly what that page lists (all pages). Required to run Amazon.
  # NOTE: `want` above still applies on top (titles, locations, seniority) — see its comment.
  search_url: "https://www.amazon.jobs/en/search?category[]=software-development&country[]=CAN&industry_experience=four_to_six_years&sort=relevant"
  ai_consent: false     # Amazon's one-time "may we use AI to recommend jobs / refer you" prompt (false = decline)
