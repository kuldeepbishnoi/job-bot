<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="0.55" stop-color="#7b6bff"/>
      <stop offset="1" stop-color="#5a4bd6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Chrome-style squircle: 22% corner radius reads as an app tile, not a sticker. -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="128" height="64" rx="28" fill="url(#sheen)"/>

  <!-- Briefcase = jobs. The bolt is cut OUT of it (negative space) = applied automatically. -->
  <g fill="#ffffff">
    <!-- handle -->
    <path d="M50 30h28a10 10 0 0 1 10 10v6H76v-4a3 3 0 0 0-3-3H55a3 3 0 0 0-3 3v4H40v-6a10 10 0 0 1 10-10z"/>
    <!-- body with the bolt knocked through -->
    <path fill-rule="evenodd" d="M28 52h72a10 10 0 0 1 10 10v34a10 10 0 0 1-10 10H28a10 10 0 0 1-10-10V62a10 10 0 0 1 10-10zm42 12L48 86h12l-6 18 24-24H66l4-16z"/>
  </g>
</svg>
