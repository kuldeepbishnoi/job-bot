<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobBot logs</title>
    <style>
      :root { --bg: #0f1020; --card: #1a1b2e; --fg: #eceffd; --muted: #8b8fa8; --accent: #7b6bff; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); color: var(--fg); }
      header { position: sticky; top: 0; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--card); border-bottom: 1px solid #262844; }
      header h1 { font: 600 15px system-ui, sans-serif; margin: 0 auto 0 0; }
      button, input { font: inherit; }
      button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
      button.ghost { background: transparent; color: var(--muted); border: 1px solid #262844; }
      input { background: var(--bg); color: var(--fg); border: 1px solid #262844; border-radius: 8px; padding: 6px 10px; width: 260px; }
      main { padding: 12px 16px; }
      .line { padding: 3px 0; border-bottom: 1px solid #1f2036; white-space: pre-wrap; word-break: break-word; }
      .line.err { color: #ff9b9b; } .line.out { color: #9be7a5; } .line.popup { color: #f0c674; }
      .time { color: var(--muted); }
      .empty { color: var(--muted); padding: 40px; text-align: center; }
      button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
      .app { background: var(--card); border-radius: 10px; padding: 12px 14px; margin: 10px 0; font-family: system-ui, sans-serif; }
      .app h3 { margin: 0 0 4px; font-size: 14px; } .app .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .app .st-applied { color: #9be7a5; } .app .st-parked { color: #f0c674; } .app .st-failed { color: #ff9b9b; }
      .app table { width: 100%; border-collapse: collapse; font-size: 12px; } .app td { padding: 3px 6px; border-top: 1px solid #262844; vertical-align: top; }
      .app td:first-child { color: var(--muted); width: 55%; } .app .guess { color: #f0c674; } .app .pre { color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>JobBot logs</h1>
      <button id="tab-log" class="ghost">Log</button>
      <button id="tab-apps" class="ghost">Applications</button>
      <input id="filter" placeholder="filter (e.g. outcome, 10524143, FAILED)" />
      <button id="copy">Copy all</button>
      <button id="clear" class="ghost">Clear</button>
    </header>
    <main id="lines"><div class="empty">No log lines yet.</div></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
