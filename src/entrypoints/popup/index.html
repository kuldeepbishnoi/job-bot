<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobBot</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <span class="dot"></span>
        <h1>JobBot</h1>
      </header>

      <section id="sites" class="sites"><!-- company buttons injected here --></section>

      <section class="stats">
        <div class="stat"><span id="today" class="n">0</span><span class="k">Today</span></div>
        <div class="stat"><span id="yesterday" class="n">0</span><span class="k">Yesterday</span></div>
        <div class="stat"><span id="total" class="n">0</span><span class="k">Total</span></div>
      </section>

      <p id="insights" class="insights" hidden></p>

      <button id="review" class="review" hidden></button>
      <ul id="review-list" class="review-list" hidden></ul>
      <p id="status" class="status"></p>
      <button id="stop" class="link" hidden>Stop run</button>

      <label class="daily" title="Which login this Chrome profile applies from (one Chrome profile per account; all share the profile folder)">Account <input id="account" type="email" placeholder="you+01@gmail.com" style="flex:1;background:var(--card);color:var(--fg);border:1px solid #262844;border-radius:6px;padding:3px 6px;font-size:12px" /></label>
      <footer class="foot">
        <button id="pick" class="link">Choose profile folder…</button>
        <button id="gmail" class="link">Connect Gmail…</button>
        <button id="logs" class="link">View logs</button>
        <button id="apps" class="link">Review applications</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
