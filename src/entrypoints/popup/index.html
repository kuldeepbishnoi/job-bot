<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobBot</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="head">
        <span class="dot"></span>
        <h1>JobBot</h1>
      </header>

      <section id="sites" class="sites"><!-- company buttons injected here --></section>

      <section class="stats">
        <div class="stat"><span id="today" class="n">0</span><span class="k">Today</span></div>
        <div class="stat"><span id="yesterday" class="n">0</span><span class="k">Yesterday</span></div>
        <div class="stat"><span id="total" class="n">0</span><span class="k">Total</span></div>
      </section>

      <button id="review" class="review" hidden></button>
      <ul id="review-list" class="review-list" hidden></ul>
      <p id="status" class="status"></p>

      <footer class="foot">
        <button id="pick" class="link">Choose profile folder…</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
